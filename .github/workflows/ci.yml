name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships Go; go.mod's toolchain line fetches a newer
      # one if needed.
      - run: go version
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...
  integration:
    # Namespaces, cgroups, overlayfs and veth pairs need root and a real
    # kernel. GitHub's Ubuntu runners use cgroup v2, which complements the
    # cgroup v1 host the suite was first developed on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host facts
        run: |
          uname -r
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers || true
      - name: Download modules as the runner user
        run: go mod download
      - name: Integration tests (root)
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" \
            "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "GOTOOLCHAIN=$(go env GOTOOLCHAIN)" \
            go test -tags integration -count=1 -v ./integration/
